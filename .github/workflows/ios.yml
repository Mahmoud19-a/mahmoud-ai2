name: Build iOS IPA (unsigned, for SideStore / AltStore)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['web/**', 'ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Build app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Lawha.xcodeproj \
            -scheme Lawha \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Lawha.app out/Payload/
          test -f out/Payload/Lawha.app/web/index.html
          cd out && zip -qry Lawha.ipa Payload && ls -lh Lawha.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lawha-ipa
          path: out/Lawha.ipa

      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lawha-build-${{ github.run_number }}
          name: Lawha ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: out/Lawha.ipa
          body: |
            Unsigned IPA. Install it with SideStore or AltStore, which sign it with your own Apple ID.
            ملف IPA غير موقّع. ثبّته عن طريق SideStore أو AltStore وهما يوقّعانه بحساب Apple الخاص بك.
