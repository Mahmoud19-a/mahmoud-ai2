<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<title>Lawha</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- HOME -->
<div id="home" class="screen">
  <header class="home-top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span data-t="appName"></span></div>
    <button id="langBtn" class="btn ghost small" type="button"></button>
  </header>
  <div class="home-scroll">
    <section class="hero">
      <h1 data-t="heroTitle"></h1>
      <p data-t="heroSub"></p>
      <button id="newBtn" class="btn primary" type="button"></button>
    </section>

    <h2 data-t="startWithSize"></h2>
    <div id="presetRow" class="hscroll"></div>

    <h2 data-t="yourDesigns"></h2>
    <div id="recentGrid" class="grid"></div>

    <h2 data-t="templates"></h2>
    <div id="tplCats" class="chips"></div>
    <div id="tplGrid" class="grid"></div>
    <p class="foot" data-t="footer"></p>
  </div>
</div>

<!-- EDITOR -->
<div id="editor" class="screen hidden">
  <header class="ed-top">
    <button id="backBtn" class="icon-btn flip-rtl" type="button" data-i="arrow-left" data-title="home"></button>
    <input id="titleInput" class="title-input" type="text" maxlength="80" autocomplete="off">
    <div class="spacer"></div>
    <button id="undoBtn" class="icon-btn" type="button" data-i="undo-2" data-title="undo"></button>
    <button id="redoBtn" class="icon-btn" type="button" data-i="redo-2" data-title="redo"></button>
    <button id="resizeBtn" class="icon-btn" type="button" data-i="scaling" data-title="resize"></button>
    <button id="presentBtn" class="icon-btn" type="button" data-i="play" data-title="present"></button>
    <button id="downloadBtn" class="btn primary small" type="button"></button>
  </header>
  <div class="ed-body">
    <nav id="tabs" class="tabs"></nav>
    <aside id="panel" class="panel hidden">
      <div class="panel-head"><strong id="panelTitle"></strong><button id="panelClose" class="icon-btn" type="button" data-i="x"></button></div>
      <div id="panelBody" class="panel-body"></div>
    </aside>
    <main id="stageWrap" class="stage-wrap">
      <div id="stage"></div>
      <div id="ctxbar" class="ctxbar hidden"></div>
      <div class="zoombar">
        <button id="multiBtn" class="icon-btn" type="button" data-i="square-dashed-mouse-pointer" data-title="multiSelect"></button>
        <button id="zoomOut" class="icon-btn" type="button" data-i="zoom-out"></button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" class="icon-btn" type="button" data-i="zoom-in"></button>
        <button id="zoomFit" class="icon-btn" type="button" data-i="maximize"></button>
      </div>
      <div id="pagebar" class="pagebar"></div>
    </main>
  </div>
</div>

<!-- SHEET (modal) -->
<div id="sheetBack" class="sheet-back hidden">
  <div id="sheet" class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><strong id="sheetTitle"></strong><button id="sheetClose" class="icon-btn" type="button" data-i="x"></button></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<div id="present" class="present hidden">
  <img id="presentImg" alt="">
  <div class="present-bar"><button id="presentPrev" class="icon-btn" type="button" data-i="chevron-left"></button><span id="presentLabel"></span><button id="presentNext" class="icon-btn" type="button" data-i="chevron-right"></button><button id="presentClose" class="icon-btn" type="button" data-i="x"></button></div>
</div>

<div id="toast" class="toast hidden" role="status"></div>
<input id="fileInput" type="file" accept="image/*" multiple hidden>

<script src="vendor/konva.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="icons.js"></script>
<script src="js/util.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>
<script src="js/templates.js"></script>
<script src="js/editor.js"></script>
<script src="js/panels.js"></script>
<script src="js/home.js"></script>
<script src="js/main.js"></script>
</body>
</html>
